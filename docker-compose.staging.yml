services:
  postgres:
    ports:
      - "${STAGING_DB_PORT:-15432}:5432"

  redis:
    ports:
      - "${STAGING_REDIS_PORT:-16379}:6379"

  micro-course-api:
    container_name: micro-course-micro-course-api-staging
    environment:
      CORS_ALLOWED_ORIGINS: ${STAGING_CORS_ALLOWED_ORIGINS:-http://localhost:18080,http://127.0.0.1:18080}
    ports:
      - "${STAGING_API_PORT:-18081}:8080"

  micro-course-admin:
    container_name: micro-course-micro-course-admin-staging
    ports:
      - "${STAGING_WEB_PORT:-18080}:80"

  prometheus:
    profiles:
      - monitoring

  grafana:
    profiles:
      - monitoring

  alertmanager:
    profiles:
      - monitoring

  node-exporter:
    profiles:
      - monitoring

  postgres-exporter:
    profiles:
      - monitoring

  redis-exporter:
    profiles:
      - monitoring
