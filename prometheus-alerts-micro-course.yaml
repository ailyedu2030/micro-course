# Prometheus 告警规则 — micro-course-production

# 用法：kubectl apply -f prometheus-alerts-micro-course.yaml
# 验证：promtool check rules prometheus-alerts-micro-course.yaml
# 配合：DEPLOYMENT_DECISION.md + ROLLBACK_RUNBOOK.md + MONITORING_CHECKLIST.md

groups:
  # ============================================
  # P0 关键告警 — 5 分钟内响应
  # ============================================
  - name: micro-course-critical
    interval: 30s
    rules:
      # 5xx 错误率 > 1%（5 分钟内）
      - alert: MicroCourseHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="micro-course",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="micro-course"}[5m]))
          > 0.01
        for: 5m
        labels:
          severity: critical
          team: sre
          service: micro-course
        annotations:
          summary: "5xx 错误率 > 1% (5 分钟内)"
          description: "5xx 错误率持续 > 1% 超过 5 分钟。立即执行 ROLLBACK_RUNBOOK.md 阶段 1。"
          runbook: https://github.com/ailyedu2030/micro-course/blob/main/ROLLBACK_RUNBOOK.md

      # p99 延迟 > 1s（连续 5 分钟）
      - alert: MicroCourseHighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="micro-course"}[5m]))
          ) > 1
        for: 5m
        labels:
          severity: critical
          team: sre
          service: micro-course
        annotations:
          summary: "p99 延迟 > 1s（连续 5 分钟）"
          description: "p99 延迟持续 > 1s 超过 5 分钟。立即按 ROLLBACK_RUNBOOK.md 决策。"
          runbook: https://github.com/ailyedu2030/micro-course/blob/main/ROLLBACK_RUNBOOK.md

      # 关键端点 5xx > 0（5 分钟内）
      - alert: MicroCourseCriticalEndpointErrors
        expr: |
          sum by (path) (rate(http_requests_total{job="micro-course",status=~"5..",path=~"/api/(auth|courses|orders|payment|courseware).*"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          team: sre
          service: micro-course
        annotations:
          summary: "关键端点 5xx 错误 ({{ $labels.path }})"
          description: "关键路径 5xx 错误率 > 0。立即执行 ROLLBACK_RUNBOOK.md。"

      # 服务完全宕机（无响应 1 分钟）
      - alert: MicroCourseServiceDown
        expr: up{job="micro-course"} == 0
        for: 1m
        labels:
          severity: critical
          team: sre
          service: micro-course
        annotations:
          summary: "micro-course 服务宕机"
          description: "应用 1 分钟内无响应。立即执行 ROLLBACK_RUNBOOK.md 阶段 1。"

  # ============================================
  # P1 重要告警 — 30 分钟内响应
  # ============================================
  - name: micro-course-warning
    interval: 1m
    rules:
      # 5xx 错误率 0.1-1%
      - alert: MicroCourseModerateErrorRate
        expr: |
          sum(rate(http_requests_total{job="micro-course",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="micro-course"}[5m]))
          > 0.001 and
          sum(rate(http_requests_total{job="micro-course",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="micro-course"}[5m]))
          <= 0.01
        for: 5m
        labels:
          severity: warning
          team: sre
          service: micro-course
        annotations:
          summary: "5xx 错误率 0.1-1%"
          description: "5xx 错误率在警告区间。监控 30 分钟确认是否需要降级。"

      # p99 延迟 500ms-1s
      - alert: MicroCourseModerateLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="micro-course"}[5m]))
          ) > 0.5 and
          histogram_quantile(0.99,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="micro-course"}[5m]))
          ) <= 1
        for: 5m
        labels:
          severity: warning
          team: sre
          service: micro-course
        annotations:
          summary: "p99 延迟 500ms-1s"
          description: "p99 延迟在警告区间。监控 30 分钟确认是否需要优化。"

      # JVM 堆使用率 > 80%
      - alert: MicroCourseHighHeapUsage
        expr: |
          sum(jvm_memory_used_bytes{application="micro-course"})
          /
          sum(jvm_memory_max_bytes{application="micro-course"}) > 0.8
        for: 10m
        labels:
          severity: warning
          team: sre
          service: micro-course
        annotations:
          summary: "JVM 堆使用率 > 80%"
          description: "JVM 堆使用率持续 > 80% 超过 10 分钟。考虑扩容或排查内存泄漏。"

      # DB 连接池使用率 > 75%
      - alert: MicroCourseHighDBPoolUsage
        expr: |
          hikaricpool_connections_active{application="micro-course"}
          /
          hikaricpool_connections_max{application="micro-course"} > 0.75
        for: 10m
        labels:
          severity: warning
          team: sre
          service: micro-course
        annotations:
          summary: "DB 连接池使用率 > 75%"
          description: "DB 连接池使用率持续 > 75% 超过 10 分钟。检查慢查询。"

  # ============================================
  # P1 业务指标告警
  # ============================================
  - name: micro-course-business
    interval: 1m
    rules:
      # 用户登录成功率 < 99%
      - alert: MicroCourseLowLoginSuccessRate
        expr: |
          sum(rate(user_login_attempts_total{result="success"}[5m]))
          /
          sum(rate(user_login_attempts_total[5m])) < 0.99
        for: 5m
        labels:
          severity: warning
          team: sre
          service: micro-course
        annotations:
          summary: "用户登录成功率 < 99%"
          description: "登录成功率持续 < 99% 超过 5 分钟。检查认证服务。"

      # 课程播放成功率 < 98%
      - alert: MicroCourseLowPlaybackSuccessRate
        expr: |
          sum(rate(course_playback_total{result="success"}[5m]))
          /
          sum(rate(course_playback_total[5m])) < 0.98
        for: 5m
        labels:
          severity: warning
          team: sre
          service: micro-course
        annotations:
          summary: "课程播放成功率 < 98%"
          description: "课程播放成功率持续 < 98% 超过 5 分钟。检查 TTS API 与课程服务。"

      # TTS 生成成功率 < 95%
      - alert: MicroCourseLowTTSSuccessRate
        expr: |
          sum(rate(tts_generation_total{result="success"}[5m]))
          /
          sum(rate(tts_generation_total[5m])) < 0.95
        for: 5m
        labels:
          severity: warning
          team: sre
          service: micro-course
        annotations:
          summary: "TTS 生成成功率 < 95%"
          description: "TTS 生成成功率持续 < 95% 超过 5 分钟。检查 MINIMAX_API_KEY 与 TTS 服务。"

  # ============================================
  # P2 信息告警 — 24 小时内响应
  # ============================================
  - name: micro-course-info
    interval: 5m
    rules:
      # GC 暂停 P99 > 200ms
      - alert: MicroCourseHighGCPause
        expr: |
          histogram_quantile(0.99,
            rate(jvm_gc_pause_seconds_sum[5m])
          ) > 0.2
        for: 10m
        labels:
          severity: info
          team: sre
          service: micro-course
        annotations:
          summary: "GC 暂停 P99 > 200ms"
          description: "GC 暂停时间在 200ms 以上 5 分钟。需要关注 GC 调优。"

      # 磁盘使用率 > 80%
      - alert: MicroCourseHighDiskUsage
        expr: |
          (node_filesystem_size_bytes{mountpoint="/data"} - node_filesystem_avail_bytes{mountpoint="/data"})
          /
          node_filesystem_size_bytes{mountpoint="/data"} > 0.8
        for: 30m
        labels:
          severity: info
          team: sre
          service: micro-course
        annotations:
          summary: "磁盘使用率 > 80%"
          description: "/data 磁盘使用率持续 > 80% 30 分钟。清理日志或扩容。"

