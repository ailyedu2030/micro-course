name: Auto Approve

# 由 GitHub App (microcourse-pr-bot) 代为 approve owner 自提的 PR
# 解决 GitHub 平台硬限制：PR 作者无法 approve 自己的 PR
#
# 触发: owner (ailyedu2030) 创建/更新 PR 时
# 流程: CI 全部通过 → Bot 自动 approve → owner 可正常 merge
#
# 对应 AGENTS.md Step 5.1 路径 B (分级自审)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  checks: read       # 查询 CI 状态
  pull-requests: read # 读取 PR metadata

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # 仅处理 owner (ailyedu2030) 自提的 PR
    if: github.event.pull_request.user.login == 'ailyedu2030'
    # 55 分钟总超时 — 后端 JaCoCo 覆盖率测试 CI 耗时 ~31 分钟 + e2e ~15 分钟，
    # backend job timeout 已调至 55min（Q-6，给 docker pull 留余量），此处同步
    # 防止 CI 假死后 Bot 长期挂起（即使 bash 内部 55 分钟超时，外层 job 也需兜底）
    timeout-minutes: 55
    steps:
      - name: Generate Bot Token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 7 个 CI job: 5 core + secrets-check + references-sync
          # secrets-check 和 references-sync 为 advisory (永不阻断)，
          # 但仍需等待它们出现（若 branch protection 列为 required check）
          EXPECTED_CHECKS="backend frontend e2e docker monitoring-lint secrets-check references-sync"
          MAX_WAIT=3300  # 55 minute timeout (匹配外层 job timeout-minutes: 55，与 backend job 对齐)
          INTERVAL=15
          ELAPSED=0
          CANCELLED_ROUNDS=0  # F-2026-08-10-19: 连续 cancelled 轮次计数（SHA 未变时防死循环）
          # F-2026-08-10-19: 实时跟踪最新 head SHA —— PR 作者连续 push 时旧 CI run 被 GitHub 自动取消
          # （conclusion=cancelled 是正常事件），auto-approve 必须跟随最新 commit 的 CI，而不是看旧 SHA 的 cancelled

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALL_READY=true
            # 实时获取最新 head SHA（跟随新 push）
            LATEST_SHA=$(gh pr view ${{ github.event.pull_request.number }} --repo "$GH_REPO" \
              --json headRefOid --jq .headRefOid 2>/dev/null || echo "$HEAD_SHA")
            # 若最新 SHA 与触发时不同（有新 push），更新跟踪目标
            if [ "$LATEST_SHA" != "$HEAD_SHA" ]; then
              echo "[${ELAPSED}s] new commit detected: $HEAD_SHA -> $LATEST_SHA — following latest CI"
              HEAD_SHA=$LATEST_SHA
              CANCELLED_ROUNDS=0
            fi

            CANCELLED_THIS_ROUND=0
            for check in $EXPECTED_CHECKS; do
              CONCLUSION=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs" \
                --jq ".check_runs[] | select(.name == \"$check\") | .conclusion" 2>/dev/null || echo "null")
              STATUS=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs" \
                --jq ".check_runs[] | select(.name == \"$check\") | .status" 2>/dev/null || echo "null")

              if [ "$CONCLUSION" = "null" ] || [ "$CONCLUSION" = "" ]; then
                echo "[${ELAPSED}s] $check: not started"
                ALL_READY=false
              elif [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "timed_out" ]; then
                echo "::error::$check failed with conclusion=$CONCLUSION — aborting auto-approve"
                exit 1
              elif [ "$CONCLUSION" = "cancelled" ]; then
                # F-2026-08-10-19: cancelled 容忍 —— 连续 push 时旧 run 被自动取消属正常；
                # SHA 更新则跟随新 CI；SHA 不变且持续 cancelled 超 20 轮（5min）判定真异常
                echo "::warning::$check cancelled (superseded or aborted), round=$CANCELLED_ROUNDS"
                CANCELLED_THIS_ROUND=1
                ALL_READY=false
              elif [ "$CONCLUSION" = "success" ] || [ "$CONCLUSION" = "skipped" ] || [ "$CONCLUSION" = "neutral" ]; then
                echo "[${ELAPSED}s] $check: $CONCLUSION ✓"
              else
                echo "[${ELAPSED}s] $check: $STATUS (waiting...)"
                ALL_READY=false
              fi
            done

            # F-2026-08-10-19: 连续 cancelled 且 SHA 未变超 20 轮 → 真异常 abort（防止死循环等待）
            if [ "$CANCELLED_THIS_ROUND" = "1" ]; then
              CANCELLED_ROUNDS=$((CANCELLED_ROUNDS + 1))
              if [ $CANCELLED_ROUNDS -ge 20 ]; then
                echo "::error::CI checks cancelled without new commit for 20 rounds — aborting auto-approve"
                exit 1
              fi
            fi

            if $ALL_READY; then
              echo "==> All CI checks passed after ${ELAPSED}s (head=$HEAD_SHA)"
              break
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "::error::CI checks did not pass within ${MAX_WAIT}s timeout"
            exit 1
          fi

      - name: Approve PR
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve \
            --body "✅ CI 通过 — Bot 自动 approve（AGENTS.md 路径 B：owner 自提 PR 分级自审）"
