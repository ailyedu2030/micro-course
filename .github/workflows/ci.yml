name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  # 按分支分组（标准做法）：同分支并发重跑自动取消；
  # 不同分支可并行（e2e 假失败已由测试事件驱动化根治，
  # 仓库级串行会让 PR CI 被 main push 排队阻塞，总等待更长）
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # PR-1 优化（2026-08-18）：paths-filter 增量检测
  # docs-only PR 跳过 backend/e2e/docker → wall-time 从 ~18min 降至 ~3min
  # 详见 docs/qa/ci-optimization-tracker.md
  # ─────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        # P0 修复(2026-08-19): 必须设 id 才能让下游 job 通过 needs.changes.outputs.<name> 读取 filter 输出
        # 根因: 不设 id 时 steps.filter 是 undefined → outputs.backend 空字符串 → if 评估为 false → SKIPPED
        # 影响: PR #266 首次 CI 全部 5 个 required check SKIPPED 但 mergeStateStatus=CLEAN (P0 漏洞)
        # 修复: 加 id: filter (与官方文档一致)
        uses: dorny/paths-filter@v3
        with:
          # 同时检测工作区所有相关路径
          # 注意：必须使用 working-directory 默认值（仓库根）才能匹配 micro-course-api/** 等子路径
          filters: |
            backend:
              - 'micro-course-api/**'
              - 'pom.xml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'micro-course-admin/**'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            docker:
              - 'micro-course-api/Dockerfile'
              - 'micro-course-admin/Dockerfile'
              - 'monitoring/**/Dockerfile'
              - 'docker-compose*.yml'
            monitoring:
              - 'monitoring/**'
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'CHANGELOG.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'README.md'
              - 'ROLLBACK*.md'
              - 'DEPLOYMENT*.md'
              - 'INCIDENT*.md'
              - 'MONITORING*.md'

  # 注:GitHub branch protection 要求 status check 名称与 job name 精确匹配。
  # 使用 strategy.matrix 会产生 backend (17) 后缀,与 required check "backend" 不匹配。
  # 单版本 JDK 17 不用 matrix,直接硬编码 java-version → check 名称即为 backend。
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # 45→55 (Q-6)：给 docker pull postgres/redis 镜像 + 首次 Maven 依赖下载留余量，避免偶发超时
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      # PR-1 优化: 改用 setup-java@v5 内置 cache（业界标准：100k+ repo 在用）
      # 取代手写 actions/cache@v4 ~/.m2: 内置 cache 按 pom.xml hash 精准命中,
      # 且自动处理跨 OS 路径差异 (windows runner 不需要额外 path 转换)
      # 预期节省: 30-60s/backend (依赖冷启动场景)
      - name: Set up JDK 17 (with Maven cache)
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          cache-dependency-path: micro-course-api/pom.xml

      # F-15 + Q-6：移除 services 容器编排（outage 后带 services 的 job 在 runner 上
      # 零日志卡死 4 次），改为 composite action 显式 docker 启动 + 可达验证
      # （宿主网桥 172.17.0.1 可达；backend/e2e 单一来源，消除复制粘贴漂移）
      - name: Start PostgreSQL + Redis
        uses: ./.github/actions/start-services
        with:
          db-url: jdbc:postgresql://172.17.0.1:5432/micro_course
          db-password: postgres
          redis-host: 172.17.0.1
          redis-port: "6379"
          redis-password: ""
          service-name: ci

      - name: Precheck (治理门禁)
        run: bash .claude/skills/microcourse/scripts/precheck.sh

      - name: Backend Test
        # skip spring-boot repackage: backend 测试 job 不产出/使用 fat jar
        # (e2e job 独立 mvn package 构建), repackage 纯属白跑耗时
        run: mvn -B verify -Dspring-boot.repackage.skip=true
        working-directory: ./micro-course-api
        env:
          TEST_DB_URL: jdbc:postgresql://172.17.0.1:5432/micro_course
          TEST_DB_PASSWORD: postgres
          TEST_REDIS_HOST: 172.17.0.1
          TEST_REDIS_PORT: 6379
          # P1-I-9: Redis 无密码（ci-redis 未设 requirepass），显式声明避免隐式依赖
          TEST_REDIS_PASSWORD: ""

  # 注:同 backend,frontend 不用 matrix(避免 check 名称 frontend (20)/(22) 与 required 不匹配)
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: micro-course-admin/package-lock.json

      - name: Install & Lint & Build
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build
        working-directory: ./micro-course-admin

      # i18n 完整性扫描（advisory，report-only 不阻断）；存量迁移完成后切换为硬阻断
      - name: i18n integrity scan (advisory)
        if: always()
        run: |
          node scripts/check-i18n-keys.mjs --report-only 2>&1 | tee -a i18n-scan.log
        working-directory: ./

  # P1C-14: 恢复 E2E 测试 — API 冒烟测试 + Playwright 浏览器 E2E
  # 并行启动后端 API 服务 + 前端 Preview，覆盖 API 层面和浏览器 UI 层面
  e2e:
    needs: [changes, backend, frontend]
    # PR-1 优化: docs-only PR 自动跳过 e2e（backend/frontend 也跳过）
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR-2.2 (2026-08-20): e2e Playwright 2-shard 矩阵 (docs/qa/pr-2-e2e-sharding-plan.md)
    # 预期: e2e 4min → 2min (50% 降低); Playwright shard 原生支持按 spec 文件拆分
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      # PR-1 优化: setup-java@v5 内置 maven cache（业界标准: lookup-only 由 cache action 自动处理）
      # 取代手写 actions/cache@v4 ~/.m2 —— 命中即跳过解压下载
      # 预期节省: 30-60s/e2e (依赖冷启动场景)
      - name: Set up JDK 17 (with Maven cache)
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          cache-dependency-path: micro-course-api/pom.xml

      # F-15 + Q-6：同 backend——移除 services 编排，复用 composite action 显式 docker 启动
      - name: Start PostgreSQL + Redis
        uses: ./.github/actions/start-services
        with:
          db-url: jdbc:postgresql://172.17.0.1:5432/micro_course
          db-password: postgres
          redis-host: 172.17.0.1
          redis-port: "6379"
          redis-password: ""
          service-name: ci

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: micro-course-admin/package-lock.json

      - name: Build Backend JAR
        run: mvn -B package -DskipTests -q
        working-directory: ./micro-course-api
        env:
          DB_URL: jdbc:postgresql://172.17.0.1:5432/micro_course
          DB_PASSWORD: postgres
          REDIS_HOST: 172.17.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""

      - name: Start Backend
        run: |
          java -jar target/*.jar --server.port=8080 &
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend ready (health: 200)"
              break
            fi
            echo "  attempt $i: HTTP $HTTP_CODE"
            sleep 3
          done
        working-directory: ./micro-course-api
        env:
          DB_URL: jdbc:postgresql://172.17.0.1:5432/micro_course
          DB_PASSWORD: postgres
          REDIS_HOST: 172.17.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          JWT_SECRET: ci-test-jwt-secret-key-32-chars-for-testing-only
          VIDEO_SIGN_SECRET: ci-test-video-sign-secret-key-32-char
          # ubuntu runner 无 /data（生产 Docker 镜像才有），multipart/上传/转码目录
          # 全部落 runner.temp，否则视频上传 500 / 转码失败
          MULTIPART_LOCATION: ${{ runner.temp }}/multipart
          UPLOAD_BASE_DIR: ${{ runner.temp }}/uploads
          VIDEO_STORAGE_BASE_DIR: ${{ runner.temp }}/videos
          VIDEO_UPLOAD_DIR: ${{ runner.temp }}/videos

      - name: Install PostgreSQL Client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # P1-C 修复(2026-08-03): 视频播放回归 E2E 依赖真实转码链路，
      # ubuntu-latest 镜像无 ffmpeg，缺装将导致转码 FAILED(3)
      - name: Install FFmpeg (视频转码 E2E 依赖)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Seed E2E Test Data
        run: PGPASSWORD=postgres psql -h 172.17.0.1 -U postgres -d micro_course -f src/test/resources/sql/p0-seed.sql
        working-directory: ./micro-course-api

      - name: API 冒烟测试
        run: bash scripts/e2e-test.sh
        env:
          BASE_URL: http://localhost:8080

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./micro-course-admin

      - name: Build Frontend
        run: npm run build
        working-directory: ./micro-course-admin

      - name: Start Frontend Preview
        run: |
          npx vite preview --port 8088 --host 0.0.0.0 &
          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8088 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo "Frontend ready"
              break
            fi
            echo "  attempt $i: HTTP $HTTP_CODE"
            sleep 2
          done
        working-directory: ./micro-course-admin

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./micro-course-admin

      - name: Run Playwright E2E Tests (shard ${{ matrix.shard }}/2)
        # PR-2.2: 按 shard 拆分 Playwright 测试 (matrix.shard = 1 or 2)
        run: npx playwright test --config=tests/e2e/e2e.config.ts --shard=${{ matrix.shard }}/2
        working-directory: ./micro-course-admin
        env:
          BASE_URL: http://localhost:8088

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: micro-course-admin/test-results/
          retention-days: 7

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull base images (non-blocking)
        run: docker compose pull --ignore-pull-failures 2>&1 || true

      - name: Build Docker images
        run: docker compose build

  # W35 治理: Prometheus 告警规则 + AlertManager 配置语法验证
  monitoring-lint:
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate Prometheus alert rules
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz | tar xz --strip-components=1 prometheus-2.54.1.linux-amd64/promtool
          ./promtool check rules monitoring/prometheus/alerts.yml

      - name: Validate AlertManager config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/monitoring/alertmanager/alertmanager.yml:/tmp/alertmanager.yml:ro \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.27.0 \
            check-config /tmp/alertmanager.yml

      - name: Validate Grafana dashboards JSON
        run: |
          for f in monitoring/grafana/dashboards/*.json; do
            jq empty "$f" || (echo "❌ Invalid JSON: $f" && exit 1)
            # 验证必需字段: title, uid, panels
            jq -e '.title and .uid and .panels' "$f" > /dev/null || (echo "❌ Missing required fields in $f" && exit 1)
            echo "✅ $f — valid"
          done

  # R5 治理: 部署密钥占位符检查 — PR 阶段 advisory，部署前 deploy-gate.sh --strict 阻断
  # 设计: --ci 模式 (同 default advisory) 不阻断 PR 合并；
  #       生产部署在 deploy-gate.sh 中调用 --strict 做硬阻断
  secrets-check:
    needs: changes
    # PR-1 优化: 业务/docker/monitoring 改动时跑, 纯 docs 改动跳过
    if: |
      always() && (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.docker == 'true' ||
        needs.changes.outputs.monitoring == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify no CHANGE_ME placeholders in secrets (advisory)
        run: |
          bash scripts/verify-secrets.sh --ci || {
            echo "⚠️  advisory: 部署密钥存在占位符，建议部署前替换"
            echo "  部署门禁: bash scripts/verify-secrets.sh --strict"
            exit 0  # advisory 永不阻断 CI
          }

  # R5 治理: references 同步 CI gate — 防 R2 报告 P2 漂移再发
  # check-references-sync.py 默认 advisory 模式 (exit 0 不阻断)
  # 通过 --strict 可硬阻断，用于部署前验证
  references-sync:
    needs: changes
    # PR-1 优化: docs 改动必跑, 业务代码改动也跑（references 可能被代码引用）
    if: |
      always() && (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.docs == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check references/ matches 真文档版本号 (advisory)
        run: |
          python3 scripts/check-references-sync.py
          echo "✅ references-sync 完成 (advisory 模式 — 漂移 warning 不阻断 CI)"
